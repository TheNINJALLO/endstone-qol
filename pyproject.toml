[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-qol"
version = "1.0.25"
description = "A Quality of Life plugin for Endstone BDS"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.8,<0.12",
    "chest-form-api-endstone",
    "rapidnbt"
]

[project.entry-points."endstone"]
qol = "endstone_qol:QoLPlugin"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["endstone_qol", "endstone_qol.features"]

[tool.setuptools.package-data]
"endstone_qol" = ["*.json", "*.toml"]
